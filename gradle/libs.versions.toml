[versions]
# ── Existing ──────────────────────────────────────────────────────────────────
agp                        = "9.0.1"
kotlin                     = "2.0.21"
coreKtx                    = "1.18.0"
junit                      = "4.13.2"
junitVersion               = "1.3.0"
espressoCore               = "3.7.0"
lifecycleRuntimeKtx        = "2.10.0"
activityCompose            = "1.13.0"
composeBom                 = "2024.09.00"

# ── New: Tooling ───────────────────────────────────────────────────────────────
ksp                        = "2.0.21-1.0.28"

# ── New: Dependency Injection ──────────────────────────────────────────────────
hilt                       = "2.56.2"
hiltNavigationCompose      = "1.2.0"

# ── New: Navigation ───────────────────────────────────────────────────────────
navigationCompose          = "2.8.5"

# ── New: Networking ───────────────────────────────────────────────────────────
retrofit                   = "2.11.0"
okhttp                     = "4.12.0"
kotlinxSerialization       = "1.7.3"
retrofitKotlinxConverter   = "1.0.0"

# ── New: Persistence ──────────────────────────────────────────────────────────
room                       = "2.7.1"
dataStore                  = "1.1.1"

# ── New: Lifecycle / ViewModel ────────────────────────────────────────────────
lifecycleViewModelCompose  = "2.10.0"

# ── New: Camera & QR ──────────────────────────────────────────────────────────
camerax                    = "1.4.1"
mlkitBarcode               = "17.3.0"
zxingCore                  = "3.5.3"

# ── New: Image Loading ────────────────────────────────────────────────────────
coil                       = "2.7.0"

# ── New: Coroutines ───────────────────────────────────────────────────────────
kotlinxCoroutines          = "1.9.0"

# ── New: Permissions ──────────────────────────────────────────────────────────
accompanistPermissions     = "0.36.0"

# ── Firebase ──────────────────────────────────────────────────────────────────
googleServices             = "4.4.4"
firebaseAppDistribution    = "5.0.0"

[libraries]
# ── Existing ──────────────────────────────────────────────────────────────────
androidx-core-ktx                  = { group = "androidx.core",              name = "core-ktx",                      version.ref = "coreKtx" }
junit                              = { group = "junit",                       name = "junit",                         version.ref = "junit" }
androidx-junit                     = { group = "androidx.test.ext",           name = "junit",                         version.ref = "junitVersion" }
androidx-espresso-core             = { group = "androidx.test.espresso",      name = "espresso-core",                 version.ref = "espressoCore" }
androidx-lifecycle-runtime-ktx     = { group = "androidx.lifecycle",          name = "lifecycle-runtime-ktx",         version.ref = "lifecycleRuntimeKtx" }
androidx-activity-compose          = { group = "androidx.activity",           name = "activity-compose",              version.ref = "activityCompose" }
androidx-compose-bom               = { group = "androidx.compose",            name = "compose-bom",                   version.ref = "composeBom" }
androidx-compose-ui                = { group = "androidx.compose.ui",         name = "ui" }
androidx-compose-ui-graphics       = { group = "androidx.compose.ui",         name = "ui-graphics" }
androidx-compose-ui-tooling        = { group = "androidx.compose.ui",         name = "ui-tooling" }
androidx-compose-ui-tooling-preview = { group = "androidx.compose.ui",        name = "ui-tooling-preview" }
androidx-compose-ui-test-manifest  = { group = "androidx.compose.ui",         name = "ui-test-manifest" }
androidx-compose-ui-test-junit4    = { group = "androidx.compose.ui",         name = "ui-test-junit4" }
androidx-compose-material3         = { group = "androidx.compose.material3",  name = "material3" }
androidx-compose-material-icons-extended = { group = "androidx.compose.material", name = "material-icons-extended" }

# ── Dependency Injection ───────────────────────────────────────────────────────
hilt-android                       = { group = "com.google.dagger",           name = "hilt-android",                  version.ref = "hilt" }
hilt-android-compiler              = { group = "com.google.dagger",           name = "hilt-android-compiler",         version.ref = "hilt" }
hilt-navigation-compose            = { group = "androidx.hilt",               name = "hilt-navigation-compose",       version.ref = "hiltNavigationCompose" }

# ── Navigation ─────────────────────────────────────────────────────────────────
navigation-compose                 = { group = "androidx.navigation",         name = "navigation-compose",            version.ref = "navigationCompose" }

# ── Networking ─────────────────────────────────────────────────────────────────
retrofit-core                      = { group = "com.squareup.retrofit2",      name = "retrofit",                      version.ref = "retrofit" }
retrofit-kotlinx-serialization     = { group = "com.jakewharton.retrofit",    name = "retrofit2-kotlinx-serialization-converter", version.ref = "retrofitKotlinxConverter" }
okhttp-core                        = { group = "com.squareup.okhttp3",        name = "okhttp",                        version.ref = "okhttp" }
okhttp-logging-interceptor         = { group = "com.squareup.okhttp3",        name = "logging-interceptor",           version.ref = "okhttp" }
kotlinx-serialization-json         = { group = "org.jetbrains.kotlinx",       name = "kotlinx-serialization-json",    version.ref = "kotlinxSerialization" }

# ── Persistence ────────────────────────────────────────────────────────────────
room-runtime                       = { group = "androidx.room",               name = "room-runtime",                  version.ref = "room" }
room-ktx                           = { group = "androidx.room",               name = "room-ktx",                      version.ref = "room" }
room-compiler                      = { group = "androidx.room",               name = "room-compiler",                  version.ref = "room" }
datastore-preferences              = { group = "androidx.datastore",          name = "datastore-preferences",         version.ref = "dataStore" }

# ── Lifecycle / ViewModel ──────────────────────────────────────────────────────
lifecycle-viewmodel-compose        = { group = "androidx.lifecycle",          name = "lifecycle-viewmodel-compose",   version.ref = "lifecycleViewModelCompose" }
lifecycle-runtime-compose          = { group = "androidx.lifecycle",          name = "lifecycle-runtime-compose",     version.ref = "lifecycleViewModelCompose" }

# ── Camera ────────────────────────────────────────────────────────────────────
camerax-core                       = { group = "androidx.camera",             name = "camera-core",                   version.ref = "camerax" }
camerax-camera2                    = { group = "androidx.camera",             name = "camera-camera2",                version.ref = "camerax" }
camerax-lifecycle                  = { group = "androidx.camera",             name = "camera-lifecycle",              version.ref = "camerax" }
camerax-view                       = { group = "androidx.camera",             name = "camera-view",                   version.ref = "camerax" }

# ── QR / Barcode ──────────────────────────────────────────────────────────────
mlkit-barcode-scanning             = { group = "com.google.mlkit",            name = "barcode-scanning",              version.ref = "mlkitBarcode" }
zxing-core                         = { group = "com.google.zxing",            name = "core",                          version.ref = "zxingCore" }

# ── Image Loading ─────────────────────────────────────────────────────────────
coil-compose                       = { group = "io.coil-kt",                  name = "coil-compose",                  version.ref = "coil" }

# ── Coroutines ────────────────────────────────────────────────────────────────
kotlinx-coroutines-android         = { group = "org.jetbrains.kotlinx",       name = "kotlinx-coroutines-android",    version.ref = "kotlinxCoroutines" }
kotlinx-coroutines-core            = { group = "org.jetbrains.kotlinx",       name = "kotlinx-coroutines-core",       version.ref = "kotlinxCoroutines" }

# ── Permissions ───────────────────────────────────────────────────────────────
accompanist-permissions            = { group = "com.google.accompanist",      name = "accompanist-permissions",       version.ref = "accompanistPermissions" }

# ── Google Play Services Location ─────────────────────────────────────────────
play-services-location             = { group = "com.google.android.gms",      name = "play-services-location",        version = "21.3.0" }


[plugins]
# ── Existing ──────────────────────────────────────────────────────────────────
android-application   = { id = "com.android.application",                    version.ref = "agp" }
kotlin-compose        = { id = "org.jetbrains.kotlin.plugin.compose",        version.ref = "kotlin" }

# ── New ───────────────────────────────────────────────────────────────────────
kotlin-android        = { id = "org.jetbrains.kotlin.android",               version.ref = "kotlin" }
ksp                   = { id = "com.google.devtools.ksp",                    version.ref = "ksp" }
hilt                  = { id = "com.google.dagger.hilt.android",             version.ref = "hilt" }
kotlin-serialization  = { id = "org.jetbrains.kotlin.plugin.serialization",  version.ref = "kotlin" }
firebase-appdistribution = { id = "com.google.firebase.appdistribution",     version.ref = "firebaseAppDistribution" }
google-services          = { id = "com.google.gms.google-services",            version.ref = "googleServices" }
